<!DOCTYPE html>
<!-- There is a video inside a div.  their aspect ratios are different so
   to make up for it there are black bars filling either the horizontal
   or vertical difference on both sides.  This code seeks to reposition the
   video so that the specified corner of the video is in the specified
   corner of the container.  It also wants to scale the video while
   maintaining that constraint.

   Stream source: by default the page embeds whatever the Kitten Academy
   channel is currently live-streaming (YouTube's live_stream?channel= embed),
   so a new stream URL is picked up automatically.  Users can override this
   with their own link via the ⚙ settings button; that choice is saved in
   their browser's localStorage. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitten Academy Live Stream</title>
    <style>
        /* Styling for dark mode and layout */
        body, button {
            background-color: #333; /* Dark Mode Background */
            color: white; /* Dark Mode Text Color */
            font-family: system-ui, sans-serif;
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .controls {
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        #videoContainer {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #kittenVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            transform-origin: top left;
        }
        button {
            border: none;
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #444;
        }

        /* Settings (gear) button + panel */
        #settingsButton {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            line-height: 1;
            opacity: 0.55;
        }
        #settingsButton:hover, #settingsButton[aria-expanded="true"] { opacity: 1; }
        #settingsPanel {
            position: absolute;
            right: 8px;
            top: 100%;
            z-index: 20;
            width: min(360px, calc(100vw - 32px));
            background: #262626;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            font-size: 14px;
        }
        #settingsPanel[hidden] { display: none; }
        #settingsPanel label { display: block; margin-bottom: 6px; }
        #settingsPanel input {
            box-sizing: border-box;
            width: 100%;
            padding: 6px;
            background: #1b1b1b;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
        }
        #settingsPanel .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        #settingsPanel .row button { margin: 0; background: #3a3a3a; border-radius: 4px; }
        #settingsPanel .row button:hover { background: #4a4a4a; }
        #settingsPanel .hint { color: #aaa; font-size: 12px; margin-top: 8px; }
        #settingsError { color: #ff8a80; font-size: 12px; margin-top: 6px; }
        #sourceStatus { color: #ccc; font-size: 12px; margin-bottom: 10px; word-break: break-all; }

        /* "Stream missing" message shown over the video area */
        #streamMessage {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #333;
            text-align: center;
        }
        #streamMessage[hidden] { display: none; }
        #streamMessage .box { max-width: 520px; }
        #streamMessage h2 { margin: 0 0 10px; font-size: 22px; }
        #streamMessage p { margin: 6px 0; color: #ccc; line-height: 1.4; }
        #streamMessage a { color: #8ab4f8; }
        #streamMessage button { background: #444; border-radius: 4px; }
        #streamMessage button:hover { background: #555; }
    </style>
</head>
<body>
    <div class="controls">
        <!-- Control buttons to zoom into the four quadrants of the video -->
        <button onclick="zoom('top-left')">Top Left</button>
        <button onclick="zoom('top-right')">Top Right</button>
        <button onclick="zoom('bottom-left')">Bottom Left</button>
        <button onclick="zoom('bottom-right')">Bottom Right</button>
        <button onclick="zoom('reset')">Reset</button>
        <button id="settingsButton" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">⚙</button>

        <div id="settingsPanel" hidden>
            <div id="sourceStatus"></div>
            <label for="customUrl">Use a specific YouTube stream link:</label>
            <input id="customUrl" type="text" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false">
            <div id="settingsError" hidden></div>
            <div class="row">
                <button id="saveUrl">Save</button>
                <button id="useAuto">Use automatic</button>
            </div>
            <div class="hint">Normally you can leave this alone: OK Zoomer finds the current Kitten Academy live stream on its own. A saved link is remembered in this browser only.</div>
        </div>
    </div>
    <div id="videoContainer">
        <div id="kittenVideo"></div>
        <div id="streamMessage" hidden>
            <div class="box">
                <h2 id="streamMessageTitle"></h2>
                <p id="streamMessageBody"></p>
                <p>
                    <button id="retryNow">Try again now</button>
                    <button id="messageUseAuto" hidden>Use automatic</button>
                </p>
                <p><a href="https://www.youtube.com/channel/UC83RKJs4eKHVE9v0YUyqzgg/live" target="_blank" rel="noopener">Check the channel on YouTube</a></p>
            </div>
        </div>
    </div>
    <script>
    // ---------------------------------------------------------------------
    // Configuration
    // ---------------------------------------------------------------------
    const CHANNEL_ID = 'UC83RKJs4eKHVE9v0YUyqzgg';   // Kitten Academy
    const STORAGE_KEY = 'okzoomer.customVideoId';
    const RETRY_SECONDS = 60;          // how often to re-check when the stream is missing
    const LOAD_TIMEOUT_SECONDS = 20;   // give up on a load attempt after this long

    // Scaling factor
    const scalingFactor = 2;

    // ---------------------------------------------------------------------
    // Zoom
    // ---------------------------------------------------------------------
    // Testing has shown that using scale() does not work but using .width and .height does
    // Testing after this script was written proved that translation by pixel values does work and may be easier than
    // percentages or otherwise simplify the logic, and should be possible.

    let currentQuadrant = 'reset';

    function computeSizes(scale = scalingFactor) {
        // Given aspect ratio for the video
        const givenAspectRatio = 16 / 9;

        const videoContainer = document.getElementById("videoContainer");
        const divWidth = videoContainer.offsetWidth;
        const divHeight = videoContainer.offsetHeight;
        const divAspectRatio = divWidth / divHeight;

        let barWidth, barHeight;
        if (divAspectRatio > givenAspectRatio) {
            // Wider case: black bars on the sides
            barWidth = (divWidth - (divHeight * givenAspectRatio)) / 2;
            barHeight = 0;
        } else {
            // Taller case: black bars on top and bottom
            barWidth = 0;
            barHeight = (divHeight - (divWidth / givenAspectRatio)) / 2;
        }

        // Calculate the scaling effect
        const vidWidth = (divWidth - (barWidth * 2)) * scale;
        const vidHeight = (divHeight - (barHeight * 2)) * scale;
        barWidth *= scale;
        barHeight *= scale;

        return [barWidth, barHeight, vidWidth, vidHeight, divWidth, divHeight];
    }

    function zoom(quadrant) {
        currentQuadrant = quadrant;
        const video = document.getElementById('kittenVideo');
        if (!video) return;
        const [barWidth, barHeight, vidWidth, vidHeight, divWidth, divHeight] = computeSizes();
        const xDiff = divWidth - vidWidth;
        const yDiff = divHeight - vidHeight;

        // Determine the translation needed for each quadrant
        let transform;
        switch (quadrant) {
            case 'top-left':
                transform = `translate(${-barWidth}px, ${-barHeight}px)`;
                break;
            case 'top-right':
                transform = `translate(${-barWidth + xDiff}px, ${-barHeight}px)`;
                break;
            case 'bottom-left':
                transform = `translate(${-barWidth}px, ${-barHeight + yDiff}px)`;
                break;
            case 'bottom-right':
                transform = `translate(${-barWidth + xDiff}px, ${-barHeight + yDiff}px)`;
                break;
            default: // 'reset'
                transform = 'translate(0, 0)';
                video.style.width = '100%';
                video.style.height = '100%';
                break;
        }

        if (quadrant !== 'reset') {
            video.style.width = `${scalingFactor * 100}%`;
            video.style.height = `${scalingFactor * 100}%`;
        }
        video.style.transform = transform;
    }

    // Pixel offsets depend on the window size, so re-apply the zoom when it changes
    // (window resize, phone rotation, entering/leaving fullscreen).
    window.addEventListener('resize', () => zoom(currentQuadrant));

    // Console helper for experimenting: x,y in 0..1 pick the pan position, z is the zoom factor.
    function denormalize(v, min, max) { return min + (max - min) * v }
    function morezoomiful(x, y, z) {
        const video = document.getElementById('kittenVideo');
        const [barWidth, barHeight, vidWidth, vidHeight, divWidth, divHeight] = computeSizes(z);
        const xDiff = divWidth - vidWidth;
        const yDiff = divHeight - vidHeight;

        const xpos = denormalize(x, -barWidth, xDiff - barWidth);
        const ypos = denormalize(y, -barHeight, yDiff - barHeight);
        video.style.width =  `${z * 100}%`;
        video.style.height = `${z * 100}%`;
        video.style.transform = `translate(${xpos}px, ${ypos}px)`;
    }

    // ---------------------------------------------------------------------
    // Saved custom stream (localStorage; may be unavailable in private mode)
    // ---------------------------------------------------------------------
    function getSavedVideoId() {
        try { return localStorage.getItem(STORAGE_KEY) || null; } catch (e) { return null; }
    }
    function setSavedVideoId(id) {
        try {
            if (id) localStorage.setItem(STORAGE_KEY, id);
            else localStorage.removeItem(STORAGE_KEY);
            return true;
        } catch (e) { return false; }
    }

    // Accepts a bare 11-character video ID or any common YouTube URL form:
    // watch?v=, youtu.be/, /live/, /embed/, /shorts/, with or without https://
    function parseVideoId(input) {
        const s = (input || '').trim();
        const ID = /^[\w-]{11}$/;
        if (ID.test(s)) return s;
        let u;
        try { u = new URL(/^[a-z]+:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return null; }
        const host = u.hostname.replace(/^(www|m|music)\./, '');
        let id = null;
        if (host === 'youtu.be') {
            id = u.pathname.split('/')[1];
        } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
            id = u.searchParams.get('v');
            if (!id) {
                const m = u.pathname.match(/^\/(?:live|embed|shorts|v)\/([\w-]{11})/);
                id = m && m[1];
            }
        }
        return id && ID.test(id) ? id : null;
    }

    // ---------------------------------------------------------------------
    // Player loading + "stream missing" detection (YouTube IFrame API)
    // ---------------------------------------------------------------------
    let player = null;
    let loadTimer = null;
    let retryTimer = null;
    let currentSource = null;   // { kind: 'auto' } or { kind: 'custom', id }

    function embedUrl(source) {
        const params = new URLSearchParams({ autoplay: '1', enablejsapi: '1', playsinline: '1' });
        if (location.origin && location.origin !== 'null') params.set('origin', location.origin);
        if (source.kind === 'custom') {
            return `https://www.youtube.com/embed/${source.id}?${params}`;
        }
        params.set('channel', CHANNEL_ID);
        return `https://www.youtube.com/embed/live_stream?${params}`;
    }

    function makeIframe(source) {
        const old = document.getElementById('kittenVideo');
        const iframe = document.createElement('iframe');
        iframe.id = 'kittenVideo';
        iframe.src = embedUrl(source);
        iframe.title = 'Kitten Academy Live Stream';
        iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
        old.replaceWith(iframe);
        zoom(currentQuadrant);
        return iframe;
    }

    function loadStream() {
        clearTimeout(loadTimer);
        clearTimeout(retryTimer);
        if (player && player.destroy) { try { player.destroy(); } catch (e) {} }
        player = null;

        const savedId = getSavedVideoId();
        currentSource = savedId ? { kind: 'custom', id: savedId } : { kind: 'auto' };
        updateSourceStatus();

        const iframe = makeIframe(currentSource);

        // If the IFrame API couldn't load (e.g. blocked), just show the plain embed.
        if (!window.YT || !window.YT.Player) return;

        let settled = false;
        const fail = () => { if (!settled) { settled = true; streamMissing(); } };
        const ok = () => { if (!settled) { settled = true; clearTimeout(loadTimer); hideMessage(); } };

        loadTimer = setTimeout(fail, LOAD_TIMEOUT_SECONDS * 1000);
        player = new YT.Player(iframe, {
            events: {
                onReady: () => {
                    const data = (player.getVideoData && player.getVideoData()) || {};
                    // With nothing live, the channel embed reports the placeholder id "live_stream".
                    if (data.video_id && data.video_id !== 'live_stream') {
                        if (currentSource.kind === 'auto') currentSource.resolvedId = data.video_id;
                        updateSourceStatus();
                        ok();
                    } else {
                        fail();   // live_stream embed with nothing live resolves to no video
                    }
                },
                onError: () => { settled = false; fail(); },
                onStateChange: (e) => {
                    if (e.data === YT.PlayerState.ENDED) { settled = false; fail(); }
                },
            },
        });
    }

    function streamMissing() {
        clearTimeout(loadTimer);
        const custom = currentSource && currentSource.kind === 'custom';
        showMessage(
            custom ? 'Your saved stream link isn’t working'
                   : 'The Kitten Academy Live Stream appears to be missing',
            custom ? 'That stream may have ended. Switch back to automatic to find the current Kitten Academy live stream.'
                   : 'I’m sure they’re working on it and will be back shortly! This page will keep checking automatically.',
            custom
        );
        if (!custom) retryTimer = setTimeout(loadStream, RETRY_SECONDS * 1000);
    }

    function showMessage(title, body, offerAuto) {
        document.getElementById('streamMessageTitle').textContent = title;
        document.getElementById('streamMessageBody').textContent = body;
        document.getElementById('messageUseAuto').hidden = !offerAuto;
        document.getElementById('streamMessage').hidden = false;
    }
    function hideMessage() {
        document.getElementById('streamMessage').hidden = true;
    }

    // ---------------------------------------------------------------------
    // Settings panel
    // ---------------------------------------------------------------------
    const settingsButton = document.getElementById('settingsButton');
    const settingsPanel = document.getElementById('settingsPanel');
    const customUrl = document.getElementById('customUrl');
    const settingsError = document.getElementById('settingsError');

    function updateSourceStatus() {
        const el = document.getElementById('sourceStatus');
        if (!currentSource) { el.textContent = ''; return; }
        if (currentSource.kind === 'custom') {
            el.textContent = `Now using your saved link (video ${currentSource.id}).`;
        } else {
            el.textContent = 'Now using: automatic (current Kitten Academy live stream' +
                (currentSource.resolvedId ? `, video ${currentSource.resolvedId})` : ')') + '.';
        }
    }

    function openSettings(open) {
        settingsPanel.hidden = !open;
        settingsButton.setAttribute('aria-expanded', String(open));
        if (open) {
            const saved = getSavedVideoId();
            customUrl.value = saved ? `https://www.youtube.com/watch?v=${saved}` : '';
            settingsError.hidden = true;
            customUrl.focus();
        }
    }

    function useAutomatic() {
        setSavedVideoId(null);
        openSettings(false);
        loadStream();
    }

    settingsButton.addEventListener('click', (e) => {
        e.stopPropagation();
        openSettings(settingsPanel.hidden);
    });
    document.addEventListener('click', (e) => {
        if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) openSettings(false);
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !settingsPanel.hidden) openSettings(false);
    });
    customUrl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('saveUrl').click();
    });
    document.getElementById('saveUrl').addEventListener('click', () => {
        const id = parseVideoId(customUrl.value);
        if (!id) {
            settingsError.textContent = customUrl.value.trim()
                ? 'That doesn’t look like a YouTube video link.'
                : 'Paste a YouTube link first, or choose “Use automatic”.';
            settingsError.hidden = false;
            return;
        }
        if (!setSavedVideoId(id)) {
            settingsError.textContent = 'Your browser isn’t allowing this page to save settings, so this will only last until you reload.';
            settingsError.hidden = false;
            currentSource = { kind: 'custom', id };
            loadStreamWithId(id);
            return;
        }
        openSettings(false);
        loadStream();
    });
    document.getElementById('useAuto').addEventListener('click', useAutomatic);
    document.getElementById('messageUseAuto').addEventListener('click', useAutomatic);
    document.getElementById('retryNow').addEventListener('click', loadStream);

    // Used only when localStorage is unavailable: play a custom ID for this visit.
    function loadStreamWithId(id) {
        const origGet = getSavedVideoId;
        getSavedVideoId = () => id;
        loadStream();
        getSavedVideoId = origGet;
    }

    // ---------------------------------------------------------------------
    // Startup: load the YouTube IFrame API, then the stream.
    // ---------------------------------------------------------------------
    let started = false;
    function start() { if (!started) { started = true; loadStream(); } }
    window.onYouTubeIframeAPIReady = start;
    (function () {
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        s.onerror = start;   // API blocked: fall back to a plain embed without missing-stream detection
        document.head.appendChild(s);
        // Safety net in case the API script hangs.
        setTimeout(start, 8000);
    })();
</script>

</body>
</html>
